name: Site

# Builds the TwinRobo website (MkDocs) with TwinRobo-Core checked out beside it (its
# catalog, contributing and license texts, and the API reference come from its source),
# and publishes it to GitHub Pages. It rebuilds daily, so changes in TwinRobo-Core show up
# without a commit here; run it by hand (workflow_dispatch) for an immediate rebuild.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DISABLE_MKDOCS_2_WARNING: "true"
      TWINROBO_CORE: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: TwinRobo/TwinRobo-Core
          path: core
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # The API reference is read from the source (griffe); nothing is imported,
      # so neither DeepLens nor any simulator is installed here.
      - run: pip install "mkdocs>=1.6,<2" "mkdocs-material>=9.5" "mkdocstrings[python]>=0.26" "mkdocs-gen-files>=0.5" pyyaml
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
